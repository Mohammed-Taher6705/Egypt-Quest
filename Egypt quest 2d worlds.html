<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egypt Quest</title>
<style>
:root{--bg:#0e1420;--panel:rgba(20,26,40,.92);--gold:#e6b84a;--txt:#f3ead2;--mut:#a9a290;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;color-scheme:dark}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud,#gui{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;pointer-events:none}
#gui{display:none}
.hud>*,#gui>*{pointer-events:auto}
h1{font-size:18px;margin:0;color:var(--gold)}
.pill{background:var(--panel);border:1px solid #3a3f52;border-radius:20px;padding:6px 12px;font-size:14px}
button{font:inherit;color:var(--txt);cursor:pointer}
#lang{background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:6px 12px}
#chips{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.chip{flex:none;background:var(--panel);border:1px solid #3a3f52;border-radius:18px;padding:8px 14px;font-size:14px}
.chip.done{border-color:var(--gold)}
#info{position:fixed;left:14px;right:14px;bottom:70px;max-width:420px;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px;display:none}
#info h2{margin:0 0 4px;font-size:18px;color:var(--gold)}
#info .era{color:var(--mut);font-size:13px;margin-bottom:8px}
#info p{margin:0 0 10px;line-height:1.5;font-size:14px}
#enter{background:var(--gold);color:#2a1d05;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
#x{position:absolute;top:8px;inset-inline-end:10px;background:none;border:0;font-size:20px}
#hint,#ghint{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;text-align:center;pointer-events:none;font-size:13px}
#hint{top:58px;color:var(--mut)}
#ghint{display:none;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:14px;padding:6px 12px}
body.g #gui{display:flex}
body.g #ghint{display:block}
body.g .hud,body.g #chips,body.g #info,body.g #hint{display:none}
#ghint{pointer-events:auto}#ghint .row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:4px}#tray{letter-spacing:3px;color:var(--gold);font-size:18px}#hintbtn{border:1px solid var(--gold)}
#enter:disabled{background:#2a2f40;color:var(--txt);opacity:.6;cursor:not-allowed}
#done{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:20}#done .box{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:18px;max-width:320px;text-align:center}#dbtn{background:var(--gold);color:#2a1d05;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
#idesc{white-space:pre-line}
#bmenu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:20}#bmenu .box{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:16px;width:min(340px,90vw);text-align:center}.bbtn{display:block;width:100%;margin:8px 0;padding:10px 12px;border:1px solid var(--gold);border-radius:10px;background:#2a2f40;text-align:start}.bbtn b{color:var(--gold)}.bbtn small{display:block;color:var(--mut)}
#dp{white-space:pre-line}
.bbtn:disabled{opacity:.45}
#gline{display:none}
button{touch-action:manipulation}
#hint{white-space:pre-line}
#info{bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8}
#lside,#rside,#gside{position:fixed;display:flex;flex-direction:column;gap:8px;z-index:6}
#lside,#rside{top:calc(104px + env(safe-area-inset-top,0px))}
#lside{left:8px}#rside{right:8px}
#gside{display:none;right:8px;top:calc(104px + env(safe-area-inset-top,0px))}
body.g #gside{display:flex}body.g #lside,body.g #rside{display:none}
.sbtn{width:54px;min-height:54px;border-radius:16px;background:var(--panel);border:1px solid #3a3f52;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.1}
.sbtn .e{font-size:22px}.sbtn .l{font-size:10px;color:var(--mut);margin-top:2px}
.sbtn.done{border-color:var(--gold)}.sbtn.ready{border-color:#fff;box-shadow:0 0 12px rgba(255,224,138,.85)}
#ghint{bottom:auto;top:calc(92px + env(safe-area-inset-top,0px));pointer-events:none;font-size:14px;font-weight:600}
#gline a{display:inline-block;pointer-events:auto;background:var(--gold);color:#2a1d05;border-radius:8px;padding:7px 12px;text-decoration:none;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud"><h1 id="title"></h1><div style="display:flex;gap:8px"><span class="pill" id="score"></span><button class="pill" id="mute">🔊</button><button id="lang">العربية</button></div></div>
<div id="hint"></div>
<div id="info"><button id="x">×</button><h2 id="iname"></h2><div class="era" id="iera"></div><p id="idesc"></p><button id="enter"></button></div>
<div id="lside"></div><div id="rside"></div>
<div id="gui"><span class="pill" id="gtitle"></span><span style="display:flex;gap:8px"><button class="pill" id="ginfo">ℹ️</button><button class="pill" id="gmute">🔊</button><button class="pill" id="gback"></button></span></div>
<div id="ghint"><div id="gline"></div><span id="tray"></span></div><div id="gside"><button id="hintbtn" class="sbtn"></button></div>
<div id="bmenu"></div>
<div id="done"><div class="box"><h2 id="dh" style="color:var(--gold);margin:0 0 6px"></h2><p id="dp" style="margin:0 0 12px"></p><button id="dnext" class="bbtn" style="text-align:center"></button><button id="dre" class="bbtn" style="text-align:center"></button><button id="dbtn"></button></div></div>
<script src="js/engine.js"></script><script src="js/games/giza.js"></script><script src="js/games/gem.js"></script><script src="js/games/alex.js"></script><script src="js/games/luxor.js"></script><script src="js/games/philae.js"></script><script src="js/games/abu.js"></script><script src="js/games/siwa.js"></script><script src="js/games/edfu.js"></script><script src="js/games/sinai.js"></script><script src="js/games/redsea.js"></script><script src="js/games/abydos.js"></script><script src="js/games/whitedesert.js"></script><script src="js/games/hitan.js"></script><script src="js/games/matruh.js"></script><script src="js/games/kharga.js"></script><script src="js/games/gouna.js"></script><script src="js/games/rush.js"></script><script src="js/games/quiz.js"></script><script src="js/games/catch.js"></script><script src="js/bonus-registry.js"></script><script src="js/game-loader.js"></script></body></html>
